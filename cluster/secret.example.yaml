# This is a PLACEHOLDER, not something to apply as-is.
#
# The real portfolio-status-token Secret is created out of band (kubectl
# create secret, sealed-secrets, whatever this cluster's process is) and is
# never committed to this repo. Copy this file's shape, not its value. The
# token value must match the CLUSTER_INGEST_TOKEN environment variable set
# on the Vercel project.
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-status-token
  namespace: platform
type: Opaque
stringData:
  token: REPLACE_ME_DO_NOT_COMMIT
