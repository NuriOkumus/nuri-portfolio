apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-status
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portfolio-status
rules:
# Read-only, get/list only. No watch, no write verbs, no wildcard resources
# or apiGroups anywhere in this ClusterRole -- that's the structural
# guarantee, not a convention. This SA can see node and Application status
# and nothing else in the cluster.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portfolio-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portfolio-status
subjects:
- kind: ServiceAccount
  name: portfolio-status
  namespace: platform
